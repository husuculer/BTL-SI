<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTL-SI - Bakı Türk Liseyi Super Intellekt</title>
  <style>
    :root {
      --primary-color: #6b1d38;
      --primary-hover: #52142a;
      --bg-color: #400f20;
      --card-bg: #ffffff;
      --text-color: #2b2b2b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .chat-container {
      background: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 650px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 3px solid var(--primary-color);
      overflow: hidden;
    }

    .chat-header {
      background: var(--primary-color);
      color: white;
      padding: 18px;
      text-align: center;
    }

    .chat-header h2 { margin: 0; font-size: 20px; letter-spacing: 1px; }
    .chat-header p { margin: 4px 0 0 0; font-size: 13px; opacity: 0.9; }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fdf8f9;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-msg {
      background: var(--primary-color);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .ai-msg {
      background: #f1f1f1;
      color: #1a1a1a;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid #e2e2e2;
    }

    .ai-msg img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      border: 1px solid #ddd;
    }

    .input-area {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #eee;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 2px solid #ddd;
      outline: none;
      font-size: 15px;
    }

    input:focus { border-color: var(--primary-color); }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: var(--primary-color);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: var(--primary-hover); }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>BTL-SI</h2>
      <p>Bakı Türk Liseyi Super Intellekt - Yardımçı Asistent</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message ai-msg">Salam! Mən BTL-SI, sənin məktəb assistentiyəm. Sənə necə kömək edə bilərəm? (Həmçinin şəkil yarada bilərəm, məsələn: "şəkil çək: məktəb")</div>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Mesajınızı bura yazın..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Göndər</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
